# =============================================================================
# Mbuni CEX — Helm chart values
#
# Override these with -f values.yaml, --set, or a per-env overlay file.
# =============================================================================

# ----- Image -----
image:
  repository: ghcr.io/olekariamunyororo-crypto/mbuni-cex
  tag: "1.0.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

# ----- Replicas + autoscaling -----
replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# ----- Pod resources -----
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# ----- Service -----
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# ----- Ingress -----
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: cex.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: mbuni-cex-tls
      hosts:
        - cex.example.com

# ----- Environment (NON-secret) -----
config:
  NEXTAUTH_URL: "https://cex.example.com"
  NODE_ENV: "production"

# ----- Secrets -----
envSecrets:
  DATABASE_URL: ""
  NEXTAUTH_SECRET: ""

secretExistingSecretName: ""

# ----- Probes -----
probes:
  liveness:
    enabled: true
    path: /api/session
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /api/session
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# ----- Pod-level concerns -----
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""

migration:
  enabled: true
  command: ["bun", "run", "db:migrate:deploy"]

networkPolicy:
  enabled: false
