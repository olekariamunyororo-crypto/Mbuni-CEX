# =============================================================================
# Mbuni CEX — Publish reports to GitHub Pages
# =============================================================================

name: Publish Reports

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-reports:
    name: Build Reports
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mbuni_cex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply DB schema
        run: bun run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mbuni_cex

      - name: Seed demo users
        run: bun run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mbuni_cex

      - name: Run unit tests with coverage
        run: bun run test:unit -- --coverage
        env:
          CI: "true"

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests (continue on failure — we still want the report)
        run: bun run test:e2e || true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mbuni_cex
          NEXTAUTH_SECRET: ci-reports-test-secret-not-real
          NEXTAUTH_URL: http://localhost:3000
          CI: "true"

      - name: Assemble site
        run: |
          mkdir -p ./_site/reports/coverage ./_site/reports/playwright
          if [ -d ./coverage ]; then
            cp -r ./coverage/* ./_site/reports/coverage/ 2>/dev/null || true
          fi
          if [ -d ./playwright-report ]; then
            cp -r ./playwright-report/* ./_site/reports/playwright/ 2>/dev/null || true
          fi
          cat > ./_site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Mbuni CEX — Reports</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 4rem auto; padding: 0 1.5rem; color: #1a202c; background: #f7fafc; }
              h1 { font-size: 2rem; margin-bottom: 0.5rem; }
              .subtitle { color: #718096; margin-bottom: 2rem; }
              .card { display: block; padding: 1.5rem; background: white; border: 1px solid #e2e8f0; border-radius: 0.5rem; margin-bottom: 1rem; text-decoration: none; color: inherit; }
              .card:hover { border-color: #38b2ac; }
              .card h2 { margin: 0 0 0.25rem; font-size: 1.25rem; }
              .card p { margin: 0; color: #718096; font-size: 0.9rem; }
            </style>
          </head>
          <body>
            <h1>Mbuni CEX — Reports</h1>
            <p class="subtitle">Test coverage + e2e reports for the latest commit on main.</p>
            <a class="card" href="reports/coverage/index.html">
              <h2>Coverage Report (Vitest)</h2>
              <p>Line + branch coverage for the matching engine and lib modules.</p>
            </a>
            <a class="card" href="reports/playwright/index.html">
              <h2>Playwright Report (E2E + Visual)</h2>
              <p>Functional e2e tests + visual regression screenshots.</p>
            </a>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build-reports
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
