name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          # Prefer frozen lockfile; fall back when package.json added deps (e.g. mixpanel-browser)
          if ! bun install --frozen-lockfile; then
            echo "::warning::bun.lock out of sync — running bun install to resolve"
            bun install
          fi

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit
        env:
          CI: "true"

      - name: Build
        run: bun run build
        env:
          NEXTAUTH_SECRET: ci-build-placeholder-secret-not-used-at-runtime
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mbuni_cex
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload build artifact (for downstream jobs)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: .next/standalone/
          retention-days: 3

  e2e:
    name: E2e Tests (Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mbuni_cex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          if ! bun install --frozen-lockfile; then
            echo "::warning::bun.lock out of sync — running bun install to resolve"
            bun install
          fi

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply DB schema
        run: bun run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mbuni_cex

      - name: Seed demo users
        run: bun run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mbuni_cex

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bun run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mbuni_cex
          NEXTAUTH_SECRET: ci-e2e-test-secret-not-real
          NEXTAUTH_URL: http://localhost:3000
          CI: "true"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Build + Push Image
    needs: [build, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy → Staging (Helm)
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging.cex.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Deploy
        run: |
          helm upgrade --install mbuni-cex infra/k8s/ \
            --namespace mbuni-cex-staging \
            --create-namespace \
            --atomic \
            --timeout 5m \
            --set image.repository=${{ env.REGISTRY }}/${{ github.repository }} \
            --set image.tag=sha-${GITHUB_SHA::7} \
            --set envSecrets.DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
            --set envSecrets.NEXTAUTH_SECRET="${{ secrets.STAGING_NEXTAUTH_SECRET }}"

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/mbuni-cex -n mbuni-cex-staging --timeout=300s

  deploy-production:
    name: Deploy → Production (Helm)
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://cex.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Deploy
        run: |
          helm upgrade --install mbuni-cex infra/k8s/ \
            --namespace mbuni-cex \
            --create-namespace \
            --atomic \
            --timeout 10m \
            -f infra/k8s/values-prod.yaml \
            --set image.repository=${{ env.REGISTRY }}/${{ github.repository }} \
            --set image.tag=sha-${GITHUB_SHA::7} \
            --set envSecrets.DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" \
            --set envSecrets.NEXTAUTH_SECRET="${{ secrets.PROD_NEXTAUTH_SECRET }}"
